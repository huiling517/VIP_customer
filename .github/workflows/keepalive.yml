name: Daily Keepalive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫後端 API
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: CLEAN_URL=$(printf '%s' "$KEEPALIVE_URL" | tr -d '[:space:]'); echo "網址長度：${#CLEAN_URL}"; echo "呼叫：$CLEAN_URL"; curl -f --max-time 90 "$CLEAN_URL"
